[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locus"
version = "0.1.0"
description = "Locus — a non-destructive biomedical data aggregator. Upload CSVs, get an isolated, queryable relational warehouse with provable storage guarantees."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Locus" }]
dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.7",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
# Opt-in biomedical normalization (Phase 2.3). Heavy; never required for core ingest.
bio = ["rdkit>=2024.3"]
# Sandbox experiment stack (Phase 4).
experiments = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "papermill>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
# Phase-1/2 packages. Later phases (services, api, executor, agentic) get added as built.
packages = ["src/warehouse", "src/ingest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
