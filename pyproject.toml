[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locus"
version = "0.1.0"
description = "Locus — a non-destructive biomedical data aggregator. Upload CSVs, get an isolated, queryable relational warehouse with provable storage guarantees."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Locus" }]
dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.7",
    "ollama>=0.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Opt-in biomedical normalization (Phase 2.3). Heavy; never required for core ingest.
bio = ["rdkit>=2024.3"]
# Sandbox experiment stack (Phase 4).
experiments = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "papermill>=2.6",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/warehouse",
    "src/ingest",
    "src/services",
    "src/api",
    "src/executor",
    "src/agentic",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
